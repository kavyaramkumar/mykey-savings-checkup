<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scan for MyKey Prototype</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;color:#1d1f22;text-align:center;padding:24px;box-sizing:border-box}
h1{color:#cc0000;font-size:34px;margin:0 0 6px;letter-spacing:-.02em}
p{margin:0 0 22px;color:#5f646b}
#qr{display:inline-block;padding:18px;border:6px solid #cc0000;border-radius:20px}
#qr img,#qr canvas{width:min(70vw,360px)!important;height:auto!important}
small{display:block;margin-top:18px;color:#5f646b;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>Scan to try MyKey</h1>
  <p>Savings Checkup prototype · works best on your phone</p>
  <div id="qr" role="img" aria-label="QR code to the mobile prototype"></div>
  <small id="u"></small>
  <small>Student case competition prototype. Fictional data. Not affiliated with KeyBank.</small>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const url = new URL('mobile/', location.href.split('#')[0].split('?')[0]).href;
document.getElementById('u').textContent = url;
if (window.QRCode) new QRCode(document.getElementById('qr'), { text: url, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
